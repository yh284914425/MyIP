<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords"
    content="DNS leak test, VPN leak test, privacy test, IP leak detection, online privacy, DNS security, VPN security, privacy protection">
  <meta name="description"
    content="Free DNS leak test tool. Check if your VPN is exposing your real IP address and location in 10 seconds. Protect your online privacy with SecureDNSCheck.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="oklch(1 0 0)">
  <meta name="background-color" content="oklch(1 0 0)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://securednscheck.com/">
  <meta property="og:title" content="SecureDNSCheck - Is Your VPN Leaking DNS?">
  <meta property="og:description" content="Free DNS leak test tool. Check if your VPN is exposing your real IP address and location in 10 seconds.">
  <meta property="og:image" content="/logos/logo-512.webp">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://securednscheck.com/">
  <meta property="twitter:title" content="SecureDNSCheck - Is Your VPN Leaking DNS?">
  <meta property="twitter:description" content="Free DNS leak test tool. Check if your VPN is exposing your real IP address and location in 10 seconds.">
  <meta property="twitter:image" content="/logos/logo-512.webp">

  <link rel="apple-touch-icon" href="logos/ios-logo-512.png">
  <title>SecureDNSCheck - Is Your VPN Leaking DNS? | Free Privacy Test Tool</title>
  <link rel="icon" href="logos/logo.svg">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <script>
    setTimeout(() => {
      document.getElementById('waiting-too-long').innerHTML = `
        <p>Still loading? This might take a moment on first visit.</p>
        <p>You can also try refreshing the page.</p>`
    }, 8000)
  </script>

  <style>
    /* Claude Theme Colors */
    :root {
      --primary: oklch(0.205 0 0);
      --primary-foreground: oklch(0.985 0 0);
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --border: oklch(0.922 0 0);
      --chart-1: oklch(0.81 0.10 252);
      --chart-2: oklch(0.62 0.19 260);
      --chart-3: oklch(0.55 0.22 263);
    }

    body {
      background: var(--background);
      color: var(--foreground);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .jn-spinner {
      border: 3px solid var(--chart-1);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border-left-color: transparent;
      animation: spin 1s linear infinite;
      margin-top: 16px;
    }

    .jn-loading {
      margin-top: 30vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .jn-spinner-text {
      margin-top: 16px;
      text-align: center;
    }

    .jn-spinner-text p {
      font-size: 14px;
      color: var(--foreground);
      opacity: 0.7;
      margin: 4px 0;
    }

    .logo-loading {
      width: 80px;
      height: 80px;
      fill: var(--primary);
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="jn-loading" class="jn-loading">
    <div>
      <!-- Updated logo for SecureDNSCheck -->
      <svg class="logo-loading" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        <rect x="8" y="7" width="8" height="1.5" rx="0.75" fill="white"/>
        <rect x="8" y="9.5" width="6" height="1.5" rx="0.75" fill="white"/>
        <rect x="8" y="12" width="8" height="1.5" rx="0.75" fill="white"/>
        <rect x="8" y="14.5" width="4" height="1.5" rx="0.75" fill="white"/>
      </svg>
    </div>
    <div class="jn-spinner-text">
      <p>Loading SecureDNSCheck...</p>
      <p>Preparing your privacy test tool</p>
    </div>
    <div class="jn-spinner"></div>
    <p class="jn-spinner-text" id="waiting-too-long"></p>
  </div>
  <div id="app"></div>
  <script type="module" src="/frontend/main.js"></script>
</body>

</html>
